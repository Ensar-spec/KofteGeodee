name: Build Independent Android Mod

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: n0noob/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Compile C++ with NDK
        run: |
          mkdir -p jni
          cp src/main.cpp jni/main.cpp
          echo -e "LOCAL_PATH := \$(call my-dir)\ninclude \$(CLEAR_VARS)\nLOCAL_MODULE := koftehack\nLOCAL_SRC_FILES := main.cpp\nLOCAL_LDLIBS := -llog\ninclude \$(BUILD_SHARED_LIBRARY)" > jni/Android.mk
          echo -e "APP_ABI := armeabi-v7a arm64-v8a\nAPP_PLATFORM := android-21" > jni/Application.mk
          $ANDROID_NDK_LATEST_HOME/ndk-build

      - name: Upload Mod File
        uses: actions/upload-artifact@v4
        with:
          name: Kofte_Independent_Mod
          path: libs/
